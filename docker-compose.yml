services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fahrdienst
      POSTGRES_USER: fahrdienst
      POSTGRES_PASSWORD: fahrdienst
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fahrdienst"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - "8088:8080"
    # Kein Health-Check: das ubi9-micro Image enthält weder curl noch bash.
    # Das Backend lädt den JWKS-Cache lazy beim ersten Request — Keycloak
    # muss beim Backend-Start nicht verfügbar sein.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://fahrdienst:fahrdienst@db/fahrdienst
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: fahrdienst
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_KEYCLOAK_URL: http://localhost:8088
      VITE_KEYCLOAK_REALM: fahrdienst
      VITE_KEYCLOAK_CLIENT_ID: fahrdienst-disposition
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
