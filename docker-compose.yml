services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fahrdienst
      POSTGRES_USER: fahrdienst
      POSTGRES_PASSWORD: fahrdienst
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fahrdienst"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      # Management-Port 9000 für Health-Checks aktivieren
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - "8088:8080"
    healthcheck:
      # Das Keycloak-Image (ubi9-micro) enthält kein curl/wget.
      # Stattdessen: Bash-TCP-Check gegen den Management-Port 9000.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && timeout 2 cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://fahrdienst:fahrdienst@db/fahrdienst
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: fahrdienst
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_KEYCLOAK_URL: http://localhost:8088
      VITE_KEYCLOAK_REALM: fahrdienst
      VITE_KEYCLOAK_CLIENT_ID: fahrdienst-disposition
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
